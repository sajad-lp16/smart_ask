<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Add marked library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            background: #f7f7f8;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-header {
            padding: 24px;
            border-bottom: 1px solid #ececec;
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
            background: #f0f4f9;
            border-radius: 12px 12px 0 0;
        }
        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .message.user .bubble {
            background: #007aff;
            color: #fff;
            align-self: flex-end;
        }
        .message.ai .bubble {
            background: #f0f4f9;
            color: #222;
            align-self: flex-start;
        }
        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 70%;
            font-size: 1.08em;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .chat-input-area {
            display: flex;
            padding: 18px 24px;
            border-top: 1px solid #ececec;
            background: #f7f7f8;
            border-radius: 0 0 12px 12px;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            background: #fff;
            margin-right: 12px;
        }
        .send-btn {
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .send-btn:active {
            background: #005bb5;
        }
        @media (max-width: 800px) {
            .chat-container {
                margin: 0;
                border-radius: 0;
                height: 100vh;
            }
        }
        /* Add styles for markdown content */
        .bubble pre {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .bubble code {
            background: #f6f8fa;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
        }
        .bubble p {
            margin: 0 0 12px 0;
        }
        .bubble p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Chat with AI</div>
        <div class="chat-box" id="chat-box"></div>
        <form class="chat-input-area" id="chat-form" autocomplete="off">
            <input type="text" class="chat-input" id="user-input" placeholder="Type your message..." autofocus />
            <button type="submit" class="send-btn" id="send-btn">Send</button>
        </form>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (sender === 'You' ? 'user' : 'ai');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            // Convert markdown to HTML for AI responses
            if (sender === 'AI') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerHTML = text.replace(/\n/g, '<br>');
            }
            msgDiv.appendChild(bubble);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.onsubmit = async function(e) {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;
            appendMessage('You', message);
            userInput.value = '';
            userInput.disabled = true;
            try {
                const resp = await fetch('/query?message=' + encodeURIComponent(message), {
                    headers: {
                        // If you require an API key, add it here:
                        // 'api_key': 'YOUR_API_KEY'
                    }
                });
                const data = await resp.json();
                if (data.responses) {
                    appendMessage('AI', data.responses.join('<br>'));
                } else {
                    appendMessage('AI', 'No response.');
                }
            } catch (e) {
                appendMessage('AI', 'Error: ' + e);
            }
            userInput.disabled = false;
            userInput.focus();
        };
    </script>
</body>
</html>
