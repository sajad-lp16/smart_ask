services:
  web:
    build:
      context: .
      dockerfile: ./docker/web_app/Dockerfile
    container_name: smart_ask
    restart: unless-stopped
    networks:
      app_network:
    expose:
      - "8089:8089"
    env_file:
      - .env
    depends_on:
      - redis
    command: /start.sh

  redis:
    image: redis:alpine
    container_name: redis-rag
    restart: unless-stopped
    networks:
      app_network:
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: "10.50.10.0/24"
          gateway: "10.50.10.1"